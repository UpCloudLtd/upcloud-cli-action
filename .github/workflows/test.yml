name: Test

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Lint, build, and use (${{ matrix.version }}${{ matrix.verify_attestation && ', verify attestation' || '' }})
    strategy:
      fail-fast: true
      matrix:
        verify_attestation:
          - true
        version:
          - latest
          - "3.30.0"
          - "3.31.0"
        include:
          - verify_attestation: false
            version: "latest"

    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run linting
        run: npm run lint

      - name: Build action
        run: npm run package

      - name: Check dist directory is up-to-date
        run: |
          git diff --compact-summary --exit-code || \
            (echo; echo "Unexpected difference in directories after build. Run 'npm run package' command and commit."; exit 1)

      - name: Test action with username and password
        uses: ./
        with:
          username: ${{ secrets.UPCLOUD_USERNAME }}
          password: ${{ secrets.UPCLOUD_PASSWORD }}
          version: ${{ matrix.version }}
        env:
          GH_TOKEN: ${{ matrix.verify_attestation && secrets.GITHUB_TOKEN || '' }}

      # This should use tool cache, so downloading binary and verifying attestation are skipped.
      - name: Test action with token
        uses: ./
        with:
          token: ${{ secrets.UPCLOUD_TOKEN }}
          version: ${{ matrix.version }}
        env:
          GH_TOKEN: "invalid-token"
